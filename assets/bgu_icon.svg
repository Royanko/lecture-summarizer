<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Background: deep black -->
  <rect width="256" height="256" rx="40" fill="#0a0a0f"/>

  <!-- Orange top accent bar -->
  <rect x="0" y="0" width="256" height="8" rx="4" fill="#ff5900"/>

  <!-- Light-blue bottom accent bar -->
  <rect x="0" y="248" width="256" height="8" rx="4" fill="#38bdf8"/>

  <!-- Graduation cap - mortar board, orange fill -->
  <!-- Board top (flat square rotated 45°) -->
  <polygon points="128,38 196,70 128,102 60,70" fill="#ff5900"/>
  <!-- Cap tube -->
  <rect x="118" y="70" width="20" height="52" rx="4" fill="#ff5900"/>
  <!-- Cap base circle -->
  <ellipse cx="128" cy="122" rx="36" ry="16" fill="#ff5900"/>
  <!-- Tassel cord -->
  <line x1="196" y1="70" x2="196" y2="118" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="196" cy="126" r="8" fill="#38bdf8"/>

  <!-- "BGU" text -->
  <text x="128" y="180" font-family="Arial Black, Arial, sans-serif" font-size="38"
        font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">BGU</text>

  <!-- "AI" sub-label in orange -->
  <text x="128" y="220" font-family="Arial, sans-serif" font-size="22"
        font-weight="700" fill="#ff5900" text-anchor="middle" letter-spacing="6">AI</text>
</svg>
